name: commit-write-on-readme

on:
  push:
    branches: 
      - main
  workflow_dispatch:

jobs:
  commit-write-on-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Setup Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.12'
          architecture: 'x64'
      - name: Run Python
        working-directory: ./.github-actions-scripts/write_commit_message_to_readme
        run: python write_cm_2_readme.py
